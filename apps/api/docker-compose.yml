version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: always
    container_name: AlluGen-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5438:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ayllu_gen_network
  backend:
    stop_grace_period: 35s
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: always
    container_name: AlluGen-bk
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ayllu_gen_network
    env_file:
      - .env
networks:
  ayllu_gen_network:
    driver: bridge
